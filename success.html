<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Calvoro</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            padding: 40px;
            background: var(--color-card);
            border-radius: 12px;
            border: 1px solid var(--color-border);
        }
        .success-container h1 {
            color: #2ecc71;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--color-btn-bg);
            color: var(--color-btn-text);
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h1>Payment Success</h1>
        <p>Your payment was completed successfully. Thank you for your purchase!</p>
        <a href="index.html" class="btn">Return to Home</a>
    </div>
    <script src="js/main.js"></script>
    <script>
        // Clear cart after success
        try { localStorage.removeItem('calvoro_cart_note'); } catch (e) {}
        try {
            if (window.cart && typeof window.cart.clear === 'function') {
                window.cart.clear();
            }
        } catch (e) {}
    </script>
</body>
</html>
