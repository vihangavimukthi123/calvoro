<script src="js/admin.js"></script>
<script>
    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadDashboard() {
        const base = window.CalvoroAPIBase || '';
        const tbody = document.querySelector('#recentOrdersTable tbody');

        try {
            // 1. Stats load කරන්න
            const statsRes = await fetch(base + '/api/admin/stats', { credentials: 'include' });
            if (!statsRes.ok) throw new Error(`Failed to load stats: HTTP ${statsRes.status}`);

            const stats = await statsRes.json();

            document.getElementById('totalProducts').textContent  = stats.totalProducts  ?? '0';
            document.getElementById('totalUsers').textContent     = stats.totalUsers     ?? '0';
            document.getElementById('totalOrders').textContent    = stats.totalOrders    ?? '0';
            document.getElementById('totalRevenue').textContent   = Number(stats.totalRevenue || 0).toLocaleString();
            document.getElementById('pendingOrders').textContent  = stats.pendingOrders  ?? '0';

            // 2. Recent Orders load කරන්න
            // ✅ FIXED: /api/orders → /api/admin/orders
            const ordersRes = await fetch(base + '/api/admin/orders?limit=5', { credentials: 'include' });
            
            if (!ordersRes.ok) {
                // Orders load වෙන්නේ නැත්නම් table එකේ message දෙන්න
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Could not load orders.</td></tr>';
                return;
            }

            const orders = await ordersRes.json();

            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No orders found.</td></tr>';
            } else {
                tbody.innerHTML = orders.slice(0, 5).map(order => {
                    const orderNum  = order.order_number || ('#' + order.id);
                    const customer  = order.customer_name 
                                   || ((esc(order.first_name) + ' ' + esc(order.last_name)).trim()) 
                                   || 'Guest';
                    return `
                        <tr>
                            <td>${esc(orderNum)}</td>
                            <td>${esc(customer)}</td>
                            <td>LKR ${(Number(order.total) || 0).toLocaleString()}</td>
                            <td><span class="badge badge-${esc((order.status || 'pending').toLowerCase())}">${esc(order.status || 'Pending')}</span></td>
                            <td>${order.created_at ? new Date(order.created_at).toLocaleDateString() : '—'}</td>
                        </tr>
                    `;
                }).join('');
            }

        } catch (error) {
            console.error('Dashboard Load Error:', error);
            tbody.innerHTML = `<tr><td colspan="5" class="text-center" style="color:red;">Error: ${error.message}</td></tr>`;
        }
    }

    (async function init() {
        if (typeof checkAuth === 'function') {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) loadDashboard();
        } else {
            loadDashboard();
        }
    })();
</script>
